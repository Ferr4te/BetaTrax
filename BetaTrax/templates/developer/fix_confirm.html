{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Fix Defect - BetaTrax</title>
    <link rel="stylesheet" href="{% static 'styles/styles.css' %}">
</head>
<body>
    <div class="centered-content">
        <h1>Confirm Fix</h1>
        <p>Are you sure you have fixed the defect “{{ defect.title }}”?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn">Yes, fix it</button>
            <a href="{% url 'developer_dashboard' %}" class="btn">Cancel</a>
        </form>
    </div>
</body>
</html>
